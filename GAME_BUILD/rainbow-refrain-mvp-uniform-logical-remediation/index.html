<title>Rainbow Refrain — Local MVP</title>
<style>

<body>
<main aria-label="Rainbow Refrain game"><canvas id="game" aria-label="Three lane color gate game"></canvas></main>
<section id="hud" aria-live="polite"><div class="stat"><span class="label">SCORE</span><span class="value" id="score">0</span></div><div class="stat"><span class="label">COMBO</span><span class="value" id="combo">0</span></div><div class="stat"><span class="label">MISSES</span><span class="value" id="misses">0 / 3</span></div><div class="stat"><span class="label">STATE</span><span class="value" id="state">RUN</span></div></section>

<script>(function() {
